name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/RavenAgent.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish single-file exe
        run: >
          dotnet publish src/RavenAgent -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: RavenAgent
          path: out/RavenAgent.exe
          if-no-files-found: error

      - name: Publish release (main branch)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [xml]$proj = Get-Content src/RavenAgent/RavenAgent.csproj
          $tag = "v" + ($proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag out/RavenAgent.exe --clobber
          } else {
            gh release create $tag out/RavenAgent.exe --target $env:GITHUB_SHA --title "Raven Desktop Agent $tag" --notes "Download RavenAgent.exe below and run it. See the README for setup."
          }
