name: Tool check
on:
  pull_request:
    paths: ['.github/workflows/toolcheck.yml']
jobs:
  check:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.2/whisper-bin-x64.zip -OutFile wb.zip
          Expand-Archive wb.zip wb
          $cli = (Get-ChildItem wb -Recurse -Filter whisper-cli.exe | Select-Object -First 1).FullName
          Invoke-WebRequest https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin -OutFile base.bin
          try { Invoke-WebRequest https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin -OutFile vad.bin; "VAD " + (Get-Item vad.bin).Length } catch { "VAD DOWNLOAD FAILED $_" }
          Invoke-WebRequest https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav -OutFile jfk.wav
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          $ff = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          # 25 s of near-silence (faint noise), then JFK, then 40 s of near-silence: the hallucination trap
          & $ff -hide_banner -loglevel error -y -f lavfi -i "anoisesrc=d=25:c=pink:a=0.003:r=16000" -i jfk.wav -f lavfi -i "anoisesrc=d=40:c=pink:a=0.003:r=16000" -filter_complex "[1:a]aresample=16000[j];[0:a][j][2:a]concat=n=3:v=0:a=1,aformat=sample_fmts=s16:channel_layouts=mono" test.wav
          "--- plain"
          & $cli -m base.bin -f test.wav -l en -oj -of plain -np -t 4 2>&1 | Select-Object -Last 2
          (Get-Content plain.json -Raw | ConvertFrom-Json).transcription | ForEach-Object { "$($_.offsets.from)-$($_.offsets.to): $($_.text)" }
          "--- mc0 sns"
          & $cli -m base.bin -f test.wav -l en -oj -of mc -np -t 4 -mc 0 -sns 2>&1 | Select-Object -Last 2
          (Get-Content mc.json -Raw | ConvertFrom-Json).transcription | ForEach-Object { "$($_.offsets.from)-$($_.offsets.to): $($_.text)" }
          "--- vad"
          & $cli -m base.bin -f test.wav -l en -oj -of vad -np -t 4 -mc 0 -sns --vad -vm vad.bin 2>&1 | Select-Object -Last 4
          (Get-Content vad.json -Raw | ConvertFrom-Json).transcription | ForEach-Object { "$($_.offsets.from)-$($_.offsets.to): $($_.text)" }
          "--- help vad"; & $cli -h 2>&1 | Select-String "vad|suppress|max-context|no-speech"
