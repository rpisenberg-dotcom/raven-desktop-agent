name: Tool check
on:
  pull_request:
    paths: ['.github/workflows/toolcheck.yml']
jobs:
  check:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          $rel = gh api repos/ggml-org/whisper.cpp/releases/latest | ConvertFrom-Json
          "TAG $($rel.tag_name)"; $rel.assets | ForEach-Object { "$($_.name)  $($_.size)  $($_.browser_download_url)" }
          $a = $rel.assets | Where-Object { $_.name -match 'x64' -and $_.name -match 'bin' -and $_.name -notmatch 'cuda|cublas|blas|vulkan|arm|openvino' } | Select-Object -First 1
          "PICK $($a.name)"
          Invoke-WebRequest $a.browser_download_url -OutFile wb.zip
          Expand-Archive wb.zip wb
          Get-ChildItem wb -Recurse | ForEach-Object { "$($_.FullName.Replace((Get-Location).Path,''))  $($_.Length)" }
          $cli = (Get-ChildItem wb -Recurse -Filter whisper-cli.exe | Select-Object -First 1).FullName
          Invoke-WebRequest https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin -OutFile base.bin
          Invoke-WebRequest https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav -OutFile jfk.wav
          $sw=[Diagnostics.Stopwatch]::StartNew()
          & $cli -m base.bin -f jfk.wav -l en -oj -of out -np -t 4 2>&1 | Select-Object -Last 5
          "SECONDS " + $sw.Elapsed.TotalSeconds
          Get-Content out.json -Raw
          "--- help"; & $cli -h 2>&1 | Select-String "output-json|max-len|split-on-word|threads|no-prints|prompt|vad|offset|duration"
